
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Perfumes', ~{::section})}">

<head>
    <title>Perfumes</title>
</head>

<body>

<section>

    <!-- TÍTULO -->
    <div class="encabezado-inventario">
        <h1>Inventario de perfumes</h1>
        <p>Administración y control de productos registrados.</p>
    </div>

    <!-- BOTÓN NUEVO -->
    <button type="button" id="btnNuevo">
        + Nuevo perfume
    </button>

    <!-- TABLA DE INVENTARIO -->
    <div class="tabla-contenedor">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Marca</th>
                    <th>Precio (C$)</th>
                    <th>Stock</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="tablaPerfumes">

                <tr>
                    <td colspan="7">Cargando perfumes...</td>
                </tr>

            </tbody>

        </table>

    </div>

    <!-- MODAL DE REGISTRO Y EDICIÓN -->
    <div id="modalPerfume" class="modal oculto">

        <div class="modal-contenido">

            <h2 id="tituloModal">Registrar nuevo perfume</h2>

            <form id="formPerfume">

                <!-- ID OCULTO -->
                <input type="hidden" id="idPerfume">

                <!-- NOMBRE -->
                <div class="campo">

                    <label for="nombre">Nombre del perfume</label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej. Invictus"
                        maxlength="100"
                        required>

                </div>

                <!-- MARCA -->
                <div class="campo">

                    <label for="marca">Marca</label>

                    <input
                        type="text"
                        id="marca"
                        placeholder="Ej. Paco Rabanne"
                        maxlength="100"
                        required>

                </div>

                <!-- PRECIO -->
                <div class="campo">

                    <label for="precio">Precio (C$)</label>

                    <input
                        type="number"
                        id="precio"
                        placeholder="2500"
                        min="0.01"
                        step="0.01"
                        required>

                </div>

                <!-- STOCK -->
                <div class="campo">

                    <label for="stock">Stock</label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="10"
                        min="0"
                        step="1"
                        required>

                </div>

                <!-- CATEGORÍA -->
                <div class="campo">

                    <label for="categoria">Categoría</label>

                    <select id="categoria" required>

                        <option value="">
                            Seleccione una categoría
                        </option>

                    </select>

                </div>

                <!-- BOTONES -->
                <div class="acciones">

                    <button type="submit" id="btnGuardar">
                        Guardar perfume
                    </button>

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar">

                        Cancelar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script th:src="@{/js/app.js}"></script>

</section>

</body>
</html>
